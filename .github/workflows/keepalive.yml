# Supabase 무료 프로젝트가 1주일 무활동으로 일시정지되지 않도록
# 하루에 한 번 DB에 가벼운 조회를 보냅니다.
# 주소와 키는 config.js (소스 저장소면 public/config.js) 에서 읽으므로 따로 설정할 것이 없습니다.
name: supabase-keepalive

on:
  schedule:
    - cron: '17 18 * * *'   # 매일 03:17 (한국 시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 조회
        run: |
          F=config.js; [ -f public/config.js ] && F=public/config.js
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']*" "$F" || true)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']*" "$F" || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js 가 비어 있어 건너뜁니다 (데모 모드)."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $KEY"
          echo
          echo "조회 완료"
